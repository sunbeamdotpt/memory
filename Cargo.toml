[package]
name = "sunbeam-memory"
version = "0.3.0"
edition = "2024"

[[bin]]
name = "sunbeam-memory"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["http2", "macros"] }
blake3 = "1.5"
buffa = { version = "0.3", features = ["json"] }
buffa-types = { version = "0.3", features = ["json"] }
bytes = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
connectrpc = { version = "0.3", features = ["server", "streaming"] }
crossbeam-channel = "0.5"
cxx = "1.0"
dashmap = "6"
dirs = "6.0"
fastembed = "5.11.0"
futures = "0.3"
gix = "0.70"
glob = "0.3"
http = "1"
http-body = "1"
http-body-util = "0.1"
jsonwebtoken = "9"
notify = "6"
once_cell = "1.18"
pdf_oxide = "0.3.52"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
rmcp = { version = "1.7", features = ["server", "macros", "transport-io", "transport-streamable-http-server", "schemars"] }
rusqlite = { version = "0.32", features = ["bundled"] }
schemars = "1.2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sunbeam-g2v = { version = "0.1", features = ["axum", "metrics", "tracing", "logging"] }
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["trace", "timeout", "catch-panic", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "ansi"] }
ulid = "1.1"
url = "2"
usearch = "2.25"
walkdir = "2"
ignore = "0.4"

[dev-dependencies]
serde_json = "1.0"
tempfile = "3.0"
criterion = { version = "0.5", features = ["async_tokio"] }

[build-dependencies]
connectrpc-build = "0.3"

[[bench]]
name = "search_benchmark"
harness = false
