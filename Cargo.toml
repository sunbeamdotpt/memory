[package]
name = "mcp-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sunbeam-memory"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# SQLite for semantic storage
rusqlite = { version = "0.32", features = ["bundled"] }
usearch = "2.25"

# Time handling
chrono = "0.4"

# Utilities
once_cell = "1.18"

# UUID generation
ulid = "1.1"

# Local embeddings
fastembed = "5.11.0"

# Error handling
thiserror = "1.0"

# HTTP server
actix-web = "4"

# OIDC JWT verification
jsonwebtoken = "9"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Platform directories
dirs = "6.0"

# URL parsing for security checks
url = "2"

# C++ interop (transitive via usearch, needed for error types)
cxx = "1.0"

# File watching & indexing infrastructure
crossbeam-channel = "0.5"
walkdir = "2"
blake3 = "1.5"
dashmap = "6"
notify = "6"
glob = "0.3"

# Pure Rust git implementation
gix = "0.70"

# PDF text extraction
pdf_oxide = "0.3.52"

[dev-dependencies]
serde_json = "1.0"
tempfile = "3.0"
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "search_benchmark"
harness = false
