[server]
host = "0.0.0.0"
port = 8080
auth_enabled = false
log_file = "server.log"

[auth]
enabled = false
jwt_secret = "default-secret-change-me-in-production"
required_permissions = ["memory:read", "memory:write"]

[memory]
base_dir = "./data/memory"

[ollama]
url = "http://localhost:11434"
model = "nomic-embed-text"
